<style>
 html,body{margin:0;height:100%;background:#faf6ee;overflow:hidden;font-family:system-ui,sans-serif}
 canvas.layer{position:fixed;inset:0;width:100vw;height:100vh}
 #timer{position:fixed;top:16px;right:24px;color:#6b5d54;font-size:42px;font-weight:600;
        font-variant-numeric:tabular-nums;z-index:10}
 #logo{position:fixed;bottom:64px;left:20px;z-index:10;background:#fff;border:1px solid #eee0d0;
       border-radius:10px;padding:6px 12px;display:flex;align-items:center}
 #logo img{height:52px;display:block}
 #overlay{position:fixed;inset:0;background:#faf6eeee;display:none;align-items:center;
          justify-content:center;flex-direction:column;z-index:20;gap:18px;text-align:center}
 #overlay img.biglogo{max-height:32vh;max-width:60vw}
 #overlay .msg{font-size:26px;color:#6b5d54;font-weight:600}
 #overlay .sub{font-size:16px;color:#a89a8c}
 #overlay #qrbox{background:#fff;padding:14px;border-radius:14px;border:1px solid #e2d9cc;display:none}
 #dock{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;justify-content:center;
       padding:8px;z-index:30;flex-wrap:wrap}
 #dock button{background:#fff;color:#6b5d54;border:1px solid #e2d9cc;border-radius:8px;
              padding:7px 12px;font-size:13px;cursor:pointer}
 #dock button.active{background:#f2b6c6;color:#5a3d47;border-color:#e79ab0}
 #dock button.primary{background:#7fc79b;color:#274a35;border-color:#5cae7f;font-weight:700}
 #dock button.danger{background:#f3d6a0;color:#6a4d1c;border-color:#e0b96a}
 #status{position:fixed;top:16px;left:24px;color:#a99;font-size:13px;z-index:10}
 #curs{z-index:25;pointer-events:none}
 .how{display:flex;flex-direction:column;gap:8px;background:#fff;border:2px solid #e2d9cc;
      border-radius:16px;padding:16px 26px;font-size:20px;color:#6b5d54;text-align:left;font-weight:600}
 .how b{color:#e0475f}
</style>

 for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0]*W,pts[i][1]*H);if(close)g.closePath();g.stroke();}

   el(0.18,0.2,0.05,0.05);for(let i=0;i<8;i++){const a=i/8*6.28;
     ln(0.18+Math.cos(a)*0.06,0.2+Math.sin(a)*0.08,0.18+Math.cos(a)*0.09,0.2+Math.sin(a)*0.12);}
   el(0.8,0.15,0.06,0.04);el(0.85,0.17,0.06,0.04);el(0.75,0.17,0.05,0.035);})},

   el(0.5,0.5,0.02,0.14);el(0.5,0.33,0.025,0.03);
   ln(0.49,0.31,0.44,0.22);ln(0.51,0.31,0.56,0.22);
   el(0.36,0.4,0.12,0.13);el(0.64,0.4,0.12,0.13);
   el(0.38,0.62,0.1,0.11);el(0.62,0.62,0.1,0.11);
   el(0.36,0.4,0.05,0.05);el(0.64,0.4,0.05,0.05);})},

   rect(0.35,0.52,0.05,0.07);rect(0.6,0.52,0.05,0.07);
   for(let i=0;i<5;i++)rect(0.3+i*0.08,0.42,0.04,0.03);})},

/* ---------- layout ---------- */
function resize(){W=innerWidth;H=innerHeight;[P,G,C].forEach(cv=>{cv.width=W;cv.height=H});drawGuide();}
addEventListener('resize',resize);
function drawGuide(){g.clearRect(0,0,W,H);
 PAL_POS=[];const n=PALETTE.length,sp=62,x0=W/2-(n-1)*sp/2,y0=64;
 for(let i=0;i<n;i++){const x=x0+i*sp;PAL_POS.push([x,y0,PALETTE[i]]);
  g.beginPath();g.arc(x,y0,22,0,7);g.fillStyle=PALETTE[i];g.fill();
  g.strokeStyle='rgba(0,0,0,.15)';g.lineWidth=2;g.stroke();}
 g.font='12px system-ui';g.fillStyle='#a89a8c';g.textAlign='center';
 g.fillText('point + press A to pick a color',W/2,y0+44);g.textAlign='left';
 if(zonesOn&&playersActive>1){const zw=W/playersActive;
  g.strokeStyle='rgba(120,105,95,.25)';g.lineWidth=2;g.setLineDash([8,10]);
  for(let i=1;i<playersActive;i++){g.beginPath();g.moveTo(i*zw,100);g.lineTo(i*zw,H-70);g.stroke();}
  g.setLineDash([]);}
 if(shape==='free')return;
 const N=playersActive,s=1/N;
 for(let i=0;i<N;i++){
  g.save();
  g.translate(i*W/N,(H-H*s)/2);g.scale(s,s);
  SHAPES[shape].draw();
  g.restore();
  g.beginPath();g.arc(i*W/N+26,(H-H*s)/2+18,12,0,7);
  g.fillStyle=col(i);g.fill();
  g.font='bold 13px system-ui';g.fillStyle='#fff';g.textAlign='center';
  g.fillText(String(i+1),i*W/N+26,(H-H*s)/2+23);g.textAlign='left';
 }}
function paletteSelect(pl,px,py){
 for(const[x,y,ccol]of PAL_POS){if((px-x)**2+(py-y)**2<44*44){
  playerColor[pl]=ccol;sizeFlash[pl]=Date.now();drawGuide();return true;}}
 return false;}

/* ---------- calibration (press C): 4 corner targets -> homography ---------- */
let HMAT=null, calStep=-1, calPts=[], calHold=null;
const CAL_T=[[0.08,0.10],[0.92,0.10],[0.92,0.88],[0.08,0.88]];
function solveH(src,dst){ // 4-point DLT, returns 3x3
 const A=[],b=[];
 for(let i=0;i<4;i++){const[x,y]=src[i],[u,v]=dst[i];
  A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);
  A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);}
 // gaussian elimination 8x8
 for(let c=0;c<8;c++){let piv=c;
  for(let r=c+1;r<8;r++)if(Math.abs(A[r][c])>Math.abs(A[piv][c]))piv=r;
  [A[c],A[piv]]=[A[piv],A[c]];[b[c],b[piv]]=[b[piv],b[c]];
  if(Math.abs(A[c][c])<1e-9)return null;
  for(let r=0;r<8;r++){if(r===c)continue;const f=A[r][c]/A[c][c];
   for(let k=c;k<8;k++)A[r][k]-=f*A[c][k];b[r]-=f*b[c];}}
 const h=b.map((v,i)=>v/A[i][i]);
 return [h[0],h[1],h[2],h[3],h[4],h[5],h[6],h[7],1];}
function applyH(x,y){if(!HMAT)return[x,y];
 const d=HMAT[6]*x+HMAT[7]*y+1;
 return[Math.min(1,Math.max(0,(HMAT[0]*x+HMAT[1]*y+HMAT[2])/d)),
        Math.min(1,Math.max(0,(HMAT[3]*x+HMAT[4]*y+HMAT[5])/d))];}
function startCal(){calStep=0;calPts=[];calHold=null;HMAT=null;drawGuide();
 status.textContent='CALIBRATION: point at the target, hold B until it fills';}
function calTargetDraw(){if(calStep<0)return;
 const[tx,ty]=CAL_T[calStep];
 c.beginPath();c.arc(tx*W,ty*H,26,0,7);c.strokeStyle='#e0475f';c.lineWidth=5;c.stroke();
 c.beginPath();c.arc(tx*W,ty*H,6,0,7);c.fillStyle='#e0475f';c.fill();
 if(calHold){const frac=Math.min(1,(Date.now()-calHold.t0)/900);
  c.beginPath();c.arc(tx*W,ty*H,26,-Math.PI/2,-Math.PI/2+frac*6.283);
  c.strokeStyle='#2aa876';c.lineWidth=8;c.stroke();}}
function calFeed(cur){if(calStep<0||!cur.visible)return;
 if(cur.b){if(!calHold)calHold={t0:Date.now(),xs:[],ys:[]};
  calHold.xs.push(cur.x);calHold.ys.push(cur.y);
  if(Date.now()-calHold.t0>900){
   const mx=calHold.xs.reduce((a,v)=>a+v)/calHold.xs.length;
   const my=calHold.ys.reduce((a,v)=>a+v)/calHold.ys.length;
   calPts.push([mx,my]);calHold=null;calStep++;
   if(calStep>3){HMAT=solveH(calPts,CAL_T);calStep=-1;
    status.textContent=HMAT?'calibrated \u2713':'calibration failed - press C to retry';
    if(HMAT)fetch('http://localhost:8766/cal',{method:'POST',body:JSON.stringify(HMAT)}).catch(()=>{});
    drawGuide();}}}
 else calHold=null;}
fetch('http://localhost:8766/cal').then(r=>r.json()).then(j=>{if(j)HMAT=j;}).catch(()=>{});

/* ---------- state machine: IDLE -> PLAYING <-> PAUSED -> ENDED ---------- */
let state='IDLE', tLeft=ROUND_S;
const timerEl=document.getElementById('timer'), overlay=document.getElementById('overlay'),
      omsg=document.getElementById('omsg'), osub=document.getElementById('osub'),
      qrbox=document.getElementById('qrbox');
function fmt(t){return `${Math.floor(Math.max(t,0)/60)}:${String(Math.max(t,0)%60).padStart(2,'0')}`;}
function show(msg,sub,withQR){omsg.textContent=msg;osub.textContent=sub||'';
 qrbox.style.display=withQR?'block':'none';overlay.style.display='flex';}
function hideOverlay(){overlay.style.display='none';}

function startGame(){AUDIO.jingle();AUDIO.music('paint');p.clearRect(0,0,W,H);last={};tLeft=ROUND_S;state='PLAYING';
 hideOverlay();timerEl.textContent=fmt(tLeft);updateDock();}
function pauseGame(){if(state!=='PLAYING')return;state='PAUSED';
 show('Paused','press Resume to continue');updateDock();}
function resumeGame(){if(state!=='PAUSED')return;state='PLAYING';hideOverlay();updateDock();}
async function endGame(auto){if(state!=='PLAYING'&&state!=='PAUSED')return;
 state='ENDED';updateDock();AUDIO.stopMusic();AUDIO.fanfare();
 show(auto?'Time\u2019s up! Beautiful work!':'Great painting!','saving your artwork…',false);
 const url=await saveSnapshot();
 if(url){qrbox.innerHTML='';new QRCode(qrbox,{text:url,width:180,height:180});
  show(auto?'Time\u2019s up! Beautiful work!':'Great painting!',
       'Scan to keep your artwork — stays here until the next round starts',true);}
 else show('Artwork finished!','(snapshot server unreachable — QR unavailable)',false);}
function resetAll(){state='IDLE';p.clearRect(0,0,W,H);last={};tLeft=ROUND_S;
 timerEl.textContent=fmt(ROUND_S);show('Ready to paint!','hold B steady to start \u00b7 (S key works too \u00b7 H = menu)');updateDock();}

setInterval(()=>{if(state!=='PLAYING')return;
 tLeft--;timerEl.textContent=fmt(tLeft);
 if(tLeft<=0)endGame(true);},1000);

/* ---------- snapshot ---------- */
async function saveSnapshot(){
 const flat=document.createElement('canvas');flat.width=W;flat.height=H;
 const f=flat.getContext('2d');f.fillStyle='#faf6ee';f.fillRect(0,0,W,H);
 f.drawImage(G,0,0);f.drawImage(P,0,0);
 const li=document.getElementById('logoImg');
 if(li&&li.complete&&li.naturalWidth){const h=60,w=h*li.naturalWidth/li.naturalHeight;
  f.fillStyle='#fff';f.fillRect(14,H-h-22,w+16,h+16);
  f.strokeStyle='#e2d9cc';f.strokeRect(14,H-h-22,w+16,h+16);
  f.drawImage(li,22,H-h-14,w,h);}
 try{const r=await fetch('http://localhost:8766/save',{method:'POST',
   headers:{'content-type':'application/json'},
   body:JSON.stringify({png:flat.toDataURL('image/png')})});
  return (await r.json()).url;}catch(e){console.warn('snapshot failed',e);return null;}}

/* ---------- dock ---------- */
const dock=document.getElementById('dock');
function updateDock(){dock.innerHTML='';
 for(const k in SHAPES){const b=document.createElement('button');b.textContent=SHAPES[k].label;
  if(k===shape)b.classList.add('active');
  b.onclick=()=>{shape=k;drawGuide();updateDock();};dock.appendChild(b);}
 const add=(txt,cls,fn)=>{const b=document.createElement('button');b.textContent=txt;
  if(cls)b.className=cls;b.onclick=fn;dock.appendChild(b);};
 for(let n=1;n<=4;n++){const b=document.createElement('button');
  b.textContent=n+'P';if(n===playersActive)b.classList.add('active');
  b.onclick=()=>{playersActive=n;drawGuide();updateDock();};dock.appendChild(b);}
 add('Brush \u25CF S','',()=>{for(let i=0;i<PLAYERS;i++)brushSize[i]=0;});
 add('Brush \u25CF M','',()=>{for(let i=0;i<PLAYERS;i++)brushSize[i]=2;});
 add('Brush \u25CF L','',()=>{for(let i=0;i<PLAYERS;i++)brushSize[i]=3;});
 add(distBrush?'Spray-by-distance: ON':'Spray-by-distance: OFF','',
     ()=>{distBrush=!distBrush;updateDock();});
 add(zonesOn?'Own zones: ON':'Own zones: OFF','',
     ()=>{zonesOn=!zonesOn;drawGuide();updateDock();});
 if(state==='IDLE'||state==='ENDED')add('\u25B6 Start (S)','primary',startGame);
 if(state==='PLAYING')add('\u23F8 Pause (P)','',pauseGame);
 if(state==='PAUSED')add('\u25B6 Resume (P)','primary',resumeGame);
 if(state==='PLAYING'||state==='PAUSED')add('\u25A0 End & QR (E)','danger',()=>endGame(false));
 add('Reset (R)','',resetAll);
 add('\u2302 Menu (H)','',()=>location.href='index.html');}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(k==='s'&&(state==='IDLE'||state==='ENDED'))startGame();
 else if(k==='p'&&state==='PLAYING')pauseGame();
 else if(k==='p'&&state==='PAUSED')resumeGame();
 else if(k==='e')endGame(false);
 else if(k==='r')resetAll();
 else if(k==='c')startCal();
 else if(k==='d')dbg=!dbg;
 else if(k==='h')location.href='index.html';
 else{const n=+e.key;if(n>=1&&n<=playersActive)mP=n-1;}});

/* ---------- painting ---------- */
const brushSize={}, SIZES=[10,18,26,40];
const sizeFlash={};
const bHold={};
function bumpBrush(pl,d){AUDIO.tone(d>0?520:390,.06,'triangle',.09);const cur=brushSize[pl]??2;
 brushSize[pl]=Math.min(SIZES.length-1,Math.max(0,cur+d));
 sizeFlash[pl]=Date.now();}
function cycleColor(pl,d){AUDIO.tone(700,.06,'triangle',.09);let i=PALETTE.indexOf(col(pl));if(i<0)i=pl%4;
 playerColor[pl]=PALETTE[(i+d+PALETTE.length)%PALETTE.length];
 sizeFlash[pl]=Date.now();}   // per-player index into SIZES
let distBrush=false;
function bsize(pl,sep){let s=SIZES[brushSize[pl]??2];
 if(distBrush&&sep>0){const m=Math.min(2.2,Math.max(0.5,sep/0.12));s*=m;}
 return s;}
let zonesOn=true;
function spray(pl,x,y,sep){if(state!=='PLAYING')return;
 const px=x*W,py=y*H,prev=last[pl];
 p.save();
 if(zonesOn&&playersActive>1){const zw=W/playersActive;
  p.beginPath();p.rect(pl*zw,0,zw,H);p.clip();}
 p.strokeStyle=col(pl);p.lineWidth=bsize(pl,sep);p.lineCap='round';p.lineJoin='round';
 p.beginPath();
 if(prev){const mx=(prev[0]+px)/2,my=(prev[1]+py)/2;
  p.moveTo(prev[2]??prev[0],prev[3]??prev[1]);
  p.quadraticCurveTo(prev[0],prev[1],mx,my);
  p.stroke();last[pl]=[px,py,mx,my];}
 else{p.moveTo(px,py);p.lineTo(px,py);p.stroke();last[pl]=[px,py];}
 p.restore();}
(function cursors(){c.clearRect(0,0,W,H);
 if(calStep>=0){calTargetDraw();}
 for(const k in players){const s=players[k];if(!s.visible)continue;
  const r=Math.max(8,bsize(k,s.sep)/2);
  c.beginPath();c.arc(s.x*W,s.y*H,r,0,7);c.strokeStyle=col(k);
  c.lineWidth=s.b?6:3;c.stroke();
  if(sizeFlash[k]&&Date.now()-sizeFlash[k]<900){
   c.beginPath();c.arc(s.x*W,s.y*H,bsize(k,s.sep)/2,0,7);
   c.fillStyle=col(k)+'66';c.fill();
   c.beginPath();c.arc(s.x*W,s.y*H,r+8,0,7);c.setLineDash([4,4]);c.stroke();c.setLineDash([]);}
  if(dbg){c.font='12px system-ui';c.fillStyle='#6b5d54';
   c.fillText('P'+(+k+1)+' dots:'+(s.ndots??'?')+' sep:'+(s.sep??0),s.x*W+r+8,s.y*H-r-6);}
  if((state==='IDLE'||state==='ENDED')&&bHold[k]){
   const f=Math.min(1,(Date.now()-bHold[k])/800);
   c.strokeStyle=col(k);c.lineWidth=5;
   c.beginPath();c.arc(s.x*W,s.y*H,r+14,-Math.PI/2,-Math.PI/2+f*2*Math.PI);c.stroke();
   if(f>=1){for(const kk in bHold)delete bHold[kk];startGame();}}}
 requestAnimationFrame(cursors);})();

/* ---------- inputs ---------- */
const status=document.getElementById('status');
(function connect(){const ws=new WebSocket('ws://localhost:8765');
 ws.onopen=()=>status.textContent='backend connected';
 ws.onclose=()=>{status.textContent='backend offline — mouse mode (keys 1-'+PLAYERS+', drag)';
  setTimeout(connect,2000);};
 ws.onmessage=ev=>{for(const cur of JSON.parse(ev.data).cursors){
   if(cur.player>=playersActive)continue;
   if(calStep>=0){calFeed(cur);players[cur.player]={...cur};continue;}
   const[cx,cy]=applyH(cur.x,cur.y);const cc={...cur,x:cx,y:cy};
   const prev=players[cur.player];
   if(cur.home&&!(prev&&prev.home))location.href='index.html';
   if((state==='IDLE'||state==='ENDED')){
    if(cc.b&&cc.visible){if(!bHold[cur.player])bHold[cur.player]=Date.now();}
    else delete bHold[cur.player];
   }else delete bHold[cur.player];
   if(cur.up&&!(prev&&prev.up))bumpBrush(cur.player,1);
   if(cur.down&&!(prev&&prev.down))bumpBrush(cur.player,-1);
   if(cur.right&&!(prev&&prev.right))cycleColor(cur.player,1);
   if(cur.left&&!(prev&&prev.left))cycleColor(cur.player,-1);
   if(cur.a&&!(prev&&prev.a)&&cc.visible)paletteSelect(cur.player,cc.x*W,cc.y*H);
   players[cur.player]=cc;
   if(cc.b&&cc.visible)spray(cc.player,cc.x,cc.y,cc.sep);else if(!cc.b)delete last[cc.player];}};})();
let mP=0,mD=false,dbg=false;
addEventListener('mousedown',e=>{if(e.target.tagName==='BUTTON')return;
 if(paletteSelect(mP,e.clientX,e.clientY))return;mD=true;});
addEventListener('mouseup',()=>{mD=false;delete last[mP];});
addEventListener('mousemove',e=>{const x=e.clientX/W,y=e.clientY/H;
 players[mP]={player:mP,x,y,visible:true,b:mD};if(mD)spray(mP,x,y,0);});
resize();resetAll();
</script>
</body>
